schema_version: '0.1'
metadata:
  contract_id: support
  name: Support Agent
  description: Synthetic local example
agent:
  agent_id: support
  name: Support Agent
  environment: development
identity:
  principal:
    principal_id: agent:support
    principal_type: AGENT
  acts_on_behalf_of:
    principal_id: user:local
    principal_type: USER
task_scope:
  task_id: support-task
  description: Summarize public material
  requested_capabilities:
  - ticket.read
  - ticket.update
  - email.send
tools:
  rules:
  - rule_id: ticket-read
    capability: ticket.read
    decision: ALLOW
  - rule_id: ticket-update
    capability: ticket.update
    decision: ALLOW
  - rule_id: email-send
    capability: email.send
    decision: REQUIRE_APPROVAL
  - rule_id: secrets-read
    capability: secrets.read
    decision: DENY
data:
  rules:
  - rule_id: credentials-no-egress
    label: CREDENTIAL
    denied_destinations:
    - external
    denied_capabilities:
    - email.send
budgets:
  max_tool_calls: 20
  max_runtime_seconds: 300
  max_cost_usd: 1.0
approvals:
  default_timeout_seconds: 120
invariants:
- id: untrusted-cannot-authorize
  description: Untrusted content never grants authority
  category: PROMPT_INJECTION
environment:
  mode: development
