schema_version: '0.1'
metadata:
  contract_id: coding
  name: Coding Agent
  description: Synthetic local example
agent:
  agent_id: coding
  name: Coding Agent
  environment: development
identity:
  principal:
    principal_id: agent:coding
    principal_type: AGENT
  acts_on_behalf_of:
    principal_id: user:local
    principal_type: USER
task_scope:
  task_id: coding-task
  description: Summarize public material
  requested_capabilities:
  - filesystem.read
  - filesystem.write
  - shell.execute
  resource_scopes:
    filesystem.read:
    - workspace
tools:
  rules:
  - rule_id: filesystem-read
    capability: filesystem.read
    decision: ALLOW
    resource: workspace
  - rule_id: filesystem-write
    capability: filesystem.write
    decision: REQUIRE_APPROVAL
  - rule_id: shell-execute
    capability: shell.execute
    decision: REQUIRE_APPROVAL
  - rule_id: network-external
    capability: network.external
    decision: DENY
data:
  rules:
  - rule_id: credentials-no-egress
    label: CREDENTIAL
    denied_destinations:
    - external
    denied_capabilities:
    - email.send
budgets:
  max_tool_calls: 20
  max_runtime_seconds: 300
  max_cost_usd: 1.0
approvals:
  default_timeout_seconds: 120
invariants:
- id: untrusted-cannot-authorize
  description: Untrusted content never grants authority
  category: PROMPT_INJECTION
environment:
  mode: development
