name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mcp,identity,langchain,control-plane,trust]"
      - run: python -c "import sys, ssl, platform; print(sys.version, platform.platform(), ssl.OPENSSL_VERSION)"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: agentsec examples validate
      - run: agentsec eval examples
      - run: agentsec regression run --root examples/regressions
      - run: python examples/team/demo.py
      - run: pytest
      - run: python -m build
