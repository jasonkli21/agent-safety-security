name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mcp,identity,langchain]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: agentsec examples validate
      - run: agentsec eval examples
      - run: agentsec regression run --root examples/regressions
      - run: pytest
      - run: python -m build
